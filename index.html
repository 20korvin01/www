<!DOCTYPE html>
<html>

<head>
  <meta charset="utf-8">
  <title>KIT CAMPUS</title>
  <meta name="viewport" content="initial-scale=1,maximum-scale=1,user-scalable=no">
  <!-- ################## MAPBOX ################## -->
  <!-- CSS & JS -->
  <link href="https://api.mapbox.com/mapbox-gl-js/v3.12.0/mapbox-gl.css" rel="stylesheet">
  <script src="https://api.mapbox.com/mapbox-gl-js/v3.12.0/mapbox-gl.js"></script>
  <!-- Geocoder -->
  <link href="https://api.mapbox.com/mapbox-gl-js/plugins/mapbox-gl-geocoder/v4.7.2/mapbox-gl-geocoder.css"
    rel="stylesheet" />
  <script
    src="https://api.mapbox.com/mapbox-gl-js/plugins/mapbox-gl-geocoder/v4.7.2/mapbox-gl-geocoder.min.js"></script>
  <!-- Directions -->
  <link rel="stylesheet"
    href="https://api.mapbox.com/mapbox-gl-js/plugins/mapbox-gl-directions/v4.1.1/mapbox-gl-directions.css"
    type="text/css">
  <script
    src="https://api.mapbox.com/mapbox-gl-js/plugins/mapbox-gl-directions/v4.1.1/mapbox-gl-directions.js"></script>

  <!-- ################## LEAFLET ################## -->
  <!-- CSS & JS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <!-- Routing Machine -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet-routing-machine@3.2.12/dist/leaflet-routing-machine.css" />
  <script src="https://unpkg.com/leaflet-routing-machine@3.2.12/dist/leaflet-routing-machine.js"></script>
  <!-- Control Geocoder -->
  <script src="https://unpkg.com/leaflet-control-geocoder@2.4.0/dist/Control.Geocoder.js"></script>
  <link rel="stylesheet" href="https://unpkg.com/leaflet-control-geocoder@2.4.0/dist/Control.Geocoder.css" />
  <!-- Locate Control -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet.locatecontrol@0.81.0/dist/L.Control.Locate.min.css" />
  <script src="https://unpkg.com/leaflet.locatecontrol@0.81.0/dist/L.Control.Locate.min.js"></script>
  <!-- Marker Cluster -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css" />
  <script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>
  <!-- Fullscreen -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet.fullscreen@1.6.0/Control.FullScreen.css" />
  <script src="https://unpkg.com/leaflet.fullscreen@1.6.0/Control.FullScreen.js"></script>
  <!-- Bootstrap Icons für Info-Button -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

  <!-- ################## CSS ################## -->
  <link rel="stylesheet" href="css/index.css">
  <link rel="stylesheet" href="css/leaflet_map.css">
  <link rel="stylesheet" href="css/weather.css">
  <link rel="stylesheet" href="css/geolocation.css">
</head>

<body>
  <div id="map">
    <!-- Header für die Karte -->
    <div id="header">
      <h1>Explore KIT Campus</h1>
    </div>
    <!-- Karten-Buttons: Zentrum & Geolocation Info -->
    <div id="map-buttons">
      <button id="weather-toggle" class="leaflet-btn" title="Wie ist das Wetter am KIT?" type="button"
        style="position: relative;">
        <span id="weather-icon"><i class="bi bi-cloud"></i></span>
        <span id="weather-badge"></span>
      </button>
      <button id="center-btn" class="leaflet-btn" title="Zurück zum KIT Zentrum" type="button">
        <i class="bi bi-arrow-left-circle-fill"></i>
      </button>
      <button id="geolocation-toggle" class="leaflet-btn" title="Standort-Info anzeigen" type="button">
        <i class="bi bi-info-square-fill"></i>
      </button>
      <button id="legend-toggle" class="leaflet-btn" title="Legende anzeigen/ausblenden" type="button">
        <i class="bi bi-map-fill"></i>
      </button>
    </div>
    <div id="geolocation" style="display:none;">
      <div class="weather-popup-header">
        <span id="geolocation-popup-icon"><i class="bi bi-pin-map-fill" style="color:#4ea1e0;"></i></span>
        <span id="geolocation-popup-title">Informationen zu deinem Standort</span>
      </div>
      <table id="geolocation-table">
        <tr>
          <td>Breite</td>
          <td id="geo-lat">-</td>
        </tr>
        <tr>
          <td>Länge</td>
          <td id="geo-lng">-</td>
        </tr>
        <tr>
          <td>Genauigkeit</td>
          <td id="geo-acc">-</td>
        </tr>
        <tr>
          <td>Geschwindigkeit</td>
          <td id="geo-speed">-</td>
        </tr>
        <tr>
          <td>Zoomlevel</td>
          <td id="geo-zoom">-</td>
        </tr>
      </table>
      <button id="geolocation-close" class="info-close-btn">Schließen</button>
    </div>
    <!-- Wetter-Info Popup -->
    <div id="weather-popup">
      <div class="weather-popup-header">
        <span id="weather-popup-icon"><i class="bi bi-cloud"></i></span>
        <span id="weather-popup-title">Wetter am KIT Campus Süd</span>
      </div>
      <div id="weather-popup-entries"></div>
      <div id="weather-popup-time"></div>
      <button id="weather-popup-close">Schließen</button>
    </div>
    <!-- Legende für die Karte -->
    <div id="map-legend" class="leaflet-control leaflet-bar">
      <div class="legend-title">
        <i class="bi bi-map-fill"></i> Legende
      </div>
      <div class="legend-row">
        <span class="legend-icon"><i class="bi bi-house-door-fill" style="color:#1976D2"></i></span>
        Gebäude
      </div>
      <div class="legend-row">
        <span class="legend-icon"><i class="bi bi-tree-fill" style="color:#388e3c"></i></span>
        Rasenfläche
      </div>
      <div class="legend-row">
        <span class="legend-icon"><i class="bi bi-bicycle" style="color:#009088"></i></span>
        Fahrradständer (mit Kapazität)
      </div>
      <div class="legend-row">
        <span class="legend-icon"><i class="bi bi-car-front-fill" style="color:#444"></i></span>
        Parkplatz (mit Kapazität)
      </div>
      <div class="legend-row">
        <span class="legend-icon"><i class="bi bi-geo-alt-fill" style="color:#FF5722"></i></span>
        Sonstiges
      </div>
    </div>
  </div>

  <script src="js/index.js"></script>
  <script src="js/wfs_fetch.js"></script>
  <script src="js/leaflet_map.js"></script>
  <script src="js/weather.js"></script>
</body>

</html>
